services:
  auth-service:
    build: .
    container_name: campus-auth-service
    ports:
      - "8001:8001"
    environment:
      SPRING_PROFILES_ACTIVE: dev,docker
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_ENABLED: "true"
      KAFKA_ENABLED: "true"
    restart: on-failure
    networks:
      - campus-net

networks:
  campus-net:
    external: true