services:
  db:
    image: postgres:16-alpine
    container_name: auth-service-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auth_db}
      POSTGRES_USER: ${POSTGRES_USER:-auth_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auth_password}
    ports:
      - "5433:5432"
    volumes:
      - auth_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auth_user} -d ${POSTGRES_DB:-auth_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-service
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8001
    ports:
      - "8001:8001"
    volumes:
      - ./mobile_test.html:/app/mobile_test.html:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  auth_pg_data: